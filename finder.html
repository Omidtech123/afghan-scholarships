<html lang="en">
<head>

<title>Rah — Scholarship Finder for Afghan Students</title>
<meta name="description" content="Answer a short questionnaire and get a ranked list of scholarships based on your age, education level, English proficiency, and preferred countries.">

<meta property="og:type" content="website">

<style>
  :root{
    --sand:#F6EEE0;
    --sand-deep:#EDE0C8;
    --ink:#2B241C;
    --lapis:#1B4A72;
    --lapis-deep:#123554;
    --gold:#C08A2E;
    --gold-soft:#E7C878;
    --green:#3C6E52;
    --teal:#2E6E7E;
    --rust:#A25635;
    --plum:#7A4C82;
    --card:#FFFDF8;
    --radius:18px;
    --serif:'Fraunces', serif;
    --sans:'Work Sans', sans-serif;
    --arabic:'Noto Naskh Arabic', serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--sand);
    background-image:
      radial-gradient(circle at 8% 8%, rgba(27,74,114,0.06) 0, transparent 40%),
      radial-gradient(circle at 92% 88%, rgba(192,138,46,0.09) 0, transparent 45%);
    color: var(--ink);
    font-family: var(--sans);
    min-height:100vh;
    line-height:1.5;
  }
  body.rtl{ direction: rtl; }
  body.rtl .app-text{ font-family: var(--arabic); }

  .app{
    width:100%;
    max-width:640px;
    margin: 0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding: 28px 22px 60px;
  }

  /* ---- site-wide header/footer (wraps the quiz shell above) ---- */
  .site-header{ position:sticky; top:0; z-index:50; background: rgba(246,238,224,0.92); backdrop-filter: blur(8px); border-bottom:1px solid var(--sand-deep); }
  .site-nav-row{ max-width:1120px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:16px 22px; }
  .site-header .brand{ text-decoration:none; }
  .site-header .brand-mark{ width:28px; height:28px; }
  .site-header .brand-name{ font-size:19px; }
  .site-nav-links{ display:flex; align-items:center; gap:6px; }
  .site-nav-links a{ text-decoration:none; font-size:14.5px; font-weight:600; color: var(--ink); padding:9px 14px; border-radius:999px; transition: background 0.15s; }
  .site-nav-links a:hover{ background: var(--sand-deep); }
  .site-nav-cta{ display:inline-flex; align-items:center; gap:8px; background: var(--lapis); color:#fff !important; font-weight:600; font-size:14.5px; padding:10px 18px; border-radius:999px; text-decoration:none; }
  .site-nav-cta:hover{ background: var(--lapis-deep); }
  .site-nav-toggle{ display:none; background:none; border:none; cursor:pointer; padding:8px; }
  @media (max-width: 860px){
    .site-nav-links{ position:absolute; top:100%; left:0; right:0; background: var(--card); border-bottom:1px solid var(--sand-deep); flex-direction:column; align-items:stretch; gap:0; padding: 10px 20px 18px; display:none; }
    .site-nav-links.open{ display:flex; }
    .site-nav-links a{ padding:13px 6px; border-radius:0; border-bottom:1px solid var(--sand-deep); }
    .site-nav-links .site-nav-cta{ margin-top:12px; justify-content:center; }
    .site-nav-toggle{ display:block; }
  }
  .site-footer{ border-top:1px solid var(--sand-deep); padding: 26px 22px 34px; text-align:center; max-width:640px; margin:0 auto; }
  .site-footer a{ color: var(--lapis); text-decoration:none; font-weight:600; font-size:13.5px; margin: 0 8px; }
  .site-footer p{ font-size:12.5px; color:#9c8c73; margin: 12px 0 0; }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 34px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-mark{ width:34px;height:34px;flex:0 0 auto; }
  .brand-name{
    font-family: var(--serif);
    font-weight:600;
    font-size:22px;
    color: var(--lapis-deep);
    letter-spacing:0.2px;
  }
  .lang-switch{
    display:flex;
    gap:4px;
    background: var(--sand-deep);
    border-radius: 999px;
    padding:4px;
  }
  .lang-switch button{
    border:none;
    background:transparent;
    padding:6px 12px;
    font-family: var(--sans);
    font-size:13px;
    font-weight:600;
    color: var(--ink);
    opacity:0.55;
    border-radius:999px;
    cursor:pointer;
    transition: background 0.2s, opacity 0.2s;
  }
  .lang-switch button.active{ background: var(--lapis); color: #fff; opacity:1; }

  .progress-wrap{ display:flex; gap:6px; margin-bottom: 30px; }
  .progress-seg{ flex:1; height:5px; border-radius:4px; background: var(--sand-deep); overflow:hidden; }
  .progress-seg > span{ display:block; height:100%; width:0%; background: var(--gold); transition: width 0.4s ease; }

  .screen{ display:none; flex:1; flex-direction:column; }
  .screen.active{ display:flex; }

  .intro-hero{ font-family: var(--serif); font-weight:600; font-size: 34px; line-height:1.18; color: var(--lapis-deep); margin: 6px 0 14px; }
  .intro-sub{ font-size:16px; color: #55493a; max-width: 46ch; margin-bottom: 30px; }
  .intro-points{ display:flex; flex-direction:column; gap:14px; margin-bottom:30px; }
  .intro-point{ display:flex; gap:12px; align-items:flex-start; background: var(--card); border:1px solid var(--sand-deep); border-radius: var(--radius); padding:14px 16px; }
  .intro-point svg{ flex:0 0 auto; margin-top:2px; }
  .intro-point-text b{ display:block; font-size:14.5px; margin-bottom:2px; }
  .intro-point-text span{ font-size:13.5px; color:#6b5d4a; }

  .intro-actions{ display:flex; flex-direction:column; gap:12px; align-items:flex-start; }

  .btn-primary{
    background: var(--lapis); color:#fff; border:none; font-family: var(--sans); font-weight:600; font-size:16px;
    padding: 15px 26px; border-radius: 14px; cursor:pointer; transition: background 0.2s, transform 0.15s;
    box-shadow: 0 6px 16px rgba(27,74,114,0.22);
  }
  .btn-primary:hover{ background: var(--lapis-deep); }
  .btn-primary:active{ transform: scale(0.98); }
  .btn-secondary{
    background:transparent; border:1.5px solid var(--sand-deep); color: var(--ink); font-family: var(--sans);
    font-weight:600; font-size:15px; padding:13px 22px; border-radius:14px; cursor:pointer;
  }
  .btn-secondary:hover{ border-color: var(--lapis); }
  .btn-link{
    background:none; border:none; color: var(--lapis); font-family: var(--sans); font-weight:600; font-size:14.5px;
    cursor:pointer; padding:6px 0; text-decoration: underline; text-underline-offset:3px;
  }

  .q-eyebrow{ font-size:13.5px; font-weight:600; color: var(--gold); margin-bottom:8px; }
  .q-title{ font-family: var(--serif); font-weight:600; font-size:26px; color: var(--lapis-deep); margin: 0 0 26px; line-height:1.28; }
  .options{ display:flex; flex-direction:column; gap:10px; margin-bottom: 30px; }
  .option-btn{
    text-align: left; background: var(--card); border:1.5px solid var(--sand-deep); border-radius: 14px;
    padding: 15px 18px; font-family: var(--sans); font-size:15.5px; color: var(--ink); cursor:pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  body.rtl .option-btn{ text-align:right; }
  .option-btn:hover{ border-color: var(--gold-soft); background:#FFFBF2; }
  .option-btn.selected{ border-color: var(--lapis); background: #EAF1F6; font-weight:600; }
  .num-input{
    width:100%; font-family: var(--sans); font-size:22px; padding:16px 18px; border-radius:14px;
    border:1.5px solid var(--sand-deep); background: var(--card); margin-bottom:30px; color: var(--ink);
  }
  .num-input:focus{ outline:none; border-color: var(--lapis); }
  .field-select{
    width:100%; font-family:var(--sans); font-size:16px; padding:16px 18px; border-radius:14px;
    border:1.5px solid var(--sand-deep); background:var(--card); color:var(--ink); margin-bottom:30px; cursor:pointer;
  }
  .field-select:focus{ outline:none; border-color:var(--lapis); }

  .nav-row{ display:flex; justify-content:space-between; align-items:center; margin-top:auto; gap:12px; }

  .results-head{ margin-bottom: 22px; }
  .results-eyebrow{ font-size:13.5px; font-weight:600; color: var(--green); margin-bottom:6px; }
  .results-title{ font-family: var(--serif); font-weight:600; font-size:28px; color: var(--lapis-deep); margin:0 0 8px; }
  .results-sub{ font-size:14.5px; color:#6b5d4a; }
  .scholarship-card{ background: var(--card); border:1px solid var(--sand-deep); border-radius: var(--radius); padding:20px; margin-bottom:16px; }
  .scholarship-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; cursor:pointer; }
  .scholarship-name{ font-family: var(--serif); font-weight:600; font-size:19px; color: var(--lapis-deep); margin:0 0 4px; }
  .scholarship-meta{ font-size:13px; color:#8a7a63; display:flex; flex-wrap:wrap; gap:6px 10px; }
  .match-badge{ flex:0 0 auto; background: var(--sand-deep); color: var(--lapis-deep); font-size:12px; font-weight:700; padding:5px 10px; border-radius:999px; white-space:nowrap; }
  .match-badge.strong{ background: var(--green); color:#fff; }
  .scholarship-desc{ font-size:14.5px; color: #4a3f30; margin: 12px 0 0; }
  .chevron{ transition: transform 0.2s; flex: 0 0 auto; margin-top: 4px; }
  .scholarship-card.open .chevron{ transform: rotate(180deg); }
  .scholarship-details{ display:none; margin-top:16px; padding-top:16px; border-top:1px dashed var(--sand-deep); }
  .scholarship-card.open .scholarship-details{ display:block; }
  .detail-block{ margin-bottom:14px; }
  .detail-block:last-child{ margin-bottom:0; }
  .detail-label{ font-size:12.5px; font-weight:700; color: var(--gold); margin-bottom:6px; }
  .detail-list{ margin:0; padding-inline-start: 18px; font-size:14px; color:#4a3f30; display:flex; flex-direction:column; gap:5px; }

  .other-list{ margin-top: 8px; }
  .other-item{ display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background: var(--card); border:1px solid var(--sand-deep); border-radius:12px; margin-bottom:8px; font-size:14.5px; cursor:pointer; }
  .other-item span.name{ font-weight:600; }

  .footer-note{ text-align:center; font-size:12.5px; color:#9c8c73; margin-top:30px; line-height:1.6; }

  /* Portfolio tips screen */
  .tips-header{ margin-bottom:22px; }
  .tips-eyebrow{ font-size:13.5px; font-weight:600; color: var(--rust); margin-bottom:6px; }
  .tips-title{ font-family: var(--serif); font-weight:600; font-size:28px; color: var(--lapis-deep); margin:0 0 8px; }
  .tips-sub{ font-size:14.5px; color:#6b5d4a; margin-bottom: 22px; }

  .tab-scroll{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:22px;
    scrollbar-width: none;
  }
  .tab-scroll::-webkit-scrollbar{ display:none; }
  .tab-pill{
    flex: 0 0 auto; display:flex; align-items:center; gap:8px; padding:10px 16px; border-radius:999px;
    border:1.5px solid var(--sand-deep); background: var(--card); font-family: var(--sans); font-weight:600;
    font-size:14px; color: var(--ink); cursor:pointer; white-space:nowrap; transition: all 0.2s;
  }
  .tab-pill .dot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .tab-pill.active{ color:#fff; border-color: transparent; }

  .tips-panel{
    background: var(--card); border:1px solid var(--sand-deep); border-radius: var(--radius);
    padding: 26px 24px; position:relative; overflow:hidden;
  }
  .tips-panel::before{
    content:""; position:absolute; top:0; left:0; right:0; height:5px; background: var(--panel-accent, var(--lapis));
  }
  body.rtl .tips-panel::before{ left:0; right:0; }
  .tips-panel-title{
    font-family: var(--serif); font-weight:600; font-size:21px; margin: 4px 0 16px; color: var(--panel-accent, var(--lapis));
  }
  .tips-steps{ display:flex; flex-direction:column; gap:14px; }
  .tips-step{ display:flex; gap:14px; align-items:flex-start; }
  .tips-step-num{
    flex:0 0 auto; width:28px; height:28px; border-radius:50%; background: var(--panel-accent, var(--lapis));
    color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;
    font-family: var(--sans);
  }
  .tips-step-text{ font-size:14.5px; color:#4a3f30; padding-top:4px; }

  @media (max-width: 400px){
    .intro-hero{ font-size:28px; }
    .q-title{ font-size:22px; }
    .tips-title{ font-size:24px; }
  }
</style>
</head>

const TIPS_ORDER = ["general","tech","medicine","business","social","arts"];

/* ============== STATE ============== */
let lang = (function(){ var saved = localStorage.getItem('rah-lang'); return (saved === 'prs' || saved === 'pus') ? saved : 'en'; })();
let currentQ = 0;
let answers = { age: null, country: null, level: null, field: null, english: null };
let activeTab = "general";
let tipsReturnScreen = "intro";
const QUESTION_KEYS = ["age","country","level","field","english"];

function t(key){ return T[lang][key]; }

const NAV_LABELS = {
  en: { nav_home:"Home", nav_scholarships:"Scholarships", nav_profile:"Build Your Profile", nav_guides:"Guides", nav_login:"Login / Sign Up" },
  prs: { nav_home:"خانه", nav_scholarships:"بورسیه‌ها", nav_profile:"پروفایل خود را بسازید", nav_guides:"راهنماها", nav_login:"ورود / ثبت‌نام" },
  pus: { nav_home:"کور", nav_scholarships:"بورسیې", nav_profile:"خپل پروفایل جوړ کړئ", nav_guides:"لارښودونه", nav_login:"ننوتل / نوم لیکنه" }
};
function applyLangToDoc(){
  document.body.classList.toggle("rtl", lang !== "en");
  document.getElementById("brandName").textContent = t("brand");
  localStorage.setItem("rah-lang", lang);
  const navLabels = NAV_LABELS[lang] || NAV_LABELS.en;
  document.querySelectorAll("#siteNavLinks [data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if(navLabels[key] !== undefined) el.textContent = navLabels[key];
  });
}

function renderIntro(){
  document.getElementById("introHero").textContent = t("introHero");
  document.getElementById("introSub").textContent = t("introSub");
  const wrap = document.getElementById("introPoints");
  wrap.innerHTML = "";
  t("points").forEach(p=>{
    const div = document.createElement("div");
    div.className = "intro-point";
    div.innerHTML = `<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="9" stroke="#C08A2E" stroke-width="1.5"/><path d="M6 10L9 13L14 7" stroke="#C08A2E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="intro-point-text"><b>${p.t}</b><span>${p.d}</span></div>`;
    wrap.appendChild(div);
  });
  document.getElementById("startBtn").textContent = t("start");
  document.getElementById("tipsLinkIntro").textContent = t("tipsLink");
}

function renderProgress(){
  const wrap = document.getElementById("progressWrap");
  if(currentScreen() !== "question"){ wrap.style.visibility = "hidden"; return; }
  wrap.style.visibility = "visible";
  wrap.innerHTML = "";
  for(let i=0;i<5;i++){
    const seg = document.createElement("div");
    seg.className = "progress-seg";
    const fill = document.createElement("span");
    fill.style.width = i < currentQ ? "100%" : (i === currentQ ? "50%" : "0%");
    seg.appendChild(fill);
    wrap.appendChild(seg);
  }
}

function currentScreen(){
  if(document.getElementById("screen-intro").classList.contains("active")) return "intro";
  if(document.getElementById("screen-question").classList.contains("active")) return "question";
  if(document.getElementById("screen-tips").classList.contains("active")) return "tips";
  return "results";
}

function showScreen(name){
  ["intro","question","results","tips"].forEach(s=>{
    document.getElementById("screen-"+s).classList.toggle("active", s===name);
  });
  renderProgress();
  window.scrollTo(0,0);
}

function renderQuestion(){
  const n = currentQ + 1;
  document.getElementById("qEyebrow").textContent = t("q"+n+"Eyebrow");
  document.getElementById("qTitle").textContent = t("q"+n+"Title");
  const body = document.getElementById("qBody");
  body.innerHTML = "";
  const key = QUESTION_KEYS[currentQ];

  if(key === "age"){
    const input = document.createElement("input");
    input.type = "number"; input.min = "10"; input.max = "60";
    input.className = "num-input";
    input.placeholder = t("q1Placeholder");
    input.value = answers.age !== null ? answers.age : "";
    input.addEventListener("input", ()=>{ answers.age = input.value ? parseInt(input.value) : null; updateNextState(); });
    body.appendChild(input);
  } else if(key === "field") {
    const select = document.createElement("select");
    select.className = "field-select";
    const placeholder = document.createElement("option");
    placeholder.value = ""; placeholder.disabled = true; placeholder.selected = answers.field === null;
    placeholder.textContent = t("q4Title");
    select.appendChild(placeholder);
    t("q4Options").forEach((label, idx)=>{
      const option = document.createElement("option");
      option.value = idx; option.textContent = label;
      option.selected = answers.field === idx;
      select.appendChild(option);
    });
    select.addEventListener("change", ()=>{ answers.field = parseInt(select.value); updateNextState(); });
    body.appendChild(select);
  } else {
    const optsWrap = document.createElement("div");
    optsWrap.className = "options";
    const options = t("q"+n+"Options");
    options.forEach((label, idx)=>{
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.textContent = label;
      if(answers[key] === idx) btn.classList.add("selected");
      btn.addEventListener("click", ()=>{
        answers[key] = idx;
        [...optsWrap.children].forEach(c=>c.classList.remove("selected"));
        btn.classList.add("selected");
        updateNextState();
      });
      optsWrap.appendChild(btn);
    });
    body.appendChild(optsWrap);
  }

  document.getElementById("backBtn").textContent = t("back");
  document.getElementById("backBtn").style.visibility = currentQ === 0 ? "hidden" : "visible";
  document.getElementById("nextBtn").textContent = currentQ === 4 ? t("seeResults") : t("next");
  updateNextState();
}

function updateNextState(){
  const key = QUESTION_KEYS[currentQ];
  const val = answers[key];
  const has = val !== null && val !== undefined && val !== "";
  document.getElementById("nextBtn").style.opacity = has ? "1" : "0.45";
  document.getElementById("nextBtn").style.pointerEvents = has ? "auto" : "none";
}

function levelFromAnswer(){
  switch(answers.level){
    case 0: return "secondary"; case 1: return "undergrad"; case 2: return "masters"; case 3: return "phd";
    default: return null;
  }
}

function computeMatches(){
  const userLevel = levelFromAnswer();
  const userAge = answers.age;
  const userCountryIdx = answers.country;
  const userEnglish = answers.english;

  const scored = SCHOLARSHIPS.map(s=>{
    let score = 0; let hardFail = false;
    if(s.levels.includes(userLevel)) score += 3; else hardFail = true;
    if(userAge !== null){
      if(userAge >= s.ageMin - 1 && userAge <= s.ageMax + 2) score += 2;
      else if(userAge >= s.ageMin - 3 && userAge <= s.ageMax + 5) score += 0.5;
      else score -= 1;
    }
    if(userCountryIdx === 6){ score += 1; }
    else if(s.countryIdx === "any") score += 1;
    else if(Array.isArray(s.countryIdx) && s.countryIdx.includes(userCountryIdx)) score += 3;
    if(userEnglish !== null){
      if(userEnglish >= s.englishMin) score += 2;
      else score -= (s.englishMin - userEnglish) * 1.5;
    }
    return { s, score, hardFail };
  });

  const eligible = scored.filter(x=>!x.hardFail);
  eligible.sort((a,b)=> b.score - a.score);
  const ineligible = scored.filter(x=>x.hardFail).map(x=>x.s);
  return { ranked: eligible, ineligible };
}

function matchLabel(score){
  if(score >= 7) return { text: t("strongMatch"), strong:true };
  if(score >= 4) return { text: t("goodMatch"), strong:false };
  return { text: t("possibleMatch"), strong:false };
}

function renderResults(){
  document.getElementById("resultsEyebrow").textContent = t("resultsEyebrow");
  document.getElementById("resultsTitle").textContent = t("resultsTitle");
  document.getElementById("resultsSub").textContent = t("resultsSub");
  document.getElementById("otherLabel").textContent = t("otherLabel");
  document.getElementById("restartBtn").textContent = t("restart");
  document.getElementById("footerNote").textContent = t("footer");
  document.getElementById("tipsLinkResults").textContent = t("tipsFromResults");

  const { ranked, ineligible } = computeMatches();
  // Show every degree-compatible programme, not just the first four.
  const top = ranked;
  const rest = [];
  const content = SCHOLARSHIP_CONTENT[lang];

  const list = document.getElementById("resultsList");
  list.innerHTML = "";
  top.forEach(({s, score})=>{
    const c = content[s.id] || s;
    const label = matchLabel(score);
    const card = document.createElement("div");
    card.className = "scholarship-card";
    card.innerHTML = `
      <div class="scholarship-top">
        <div>
          <h3 class="scholarship-name">${c.name}</h3>
          <div class="scholarship-meta"><span>${t("countryLabel")}: ${c.country}</span></div>
          <p class="scholarship-desc">${c.summary}</p>
        </div>
      </div>
      <div class="scholarship-details">
        <div class="detail-block"><div class="detail-label">${t("facts")}</div><ul class="detail-list">${c.facts.map(f=>`<li>${f}</li>`).join("")}</ul></div>
        <div class="detail-block"><div class="detail-label">${t("eligibility")}</div><ul class="detail-list">${c.eligibility.map(f=>`<li>${f}</li>`).join("")}</ul></div>
        <div class="detail-block"><div class="detail-label">${t("tips")}</div><ul class="detail-list">${c.tips.map(f=>`<li>${f}</li>`).join("")}</ul></div>
      </div>
    `;
    const badge = document.createElement("span");
    badge.className = "match-badge" + (label.strong ? " strong" : "");
    badge.textContent = label.text;
    const top1 = card.querySelector(".scholarship-top");
    const chevron = document.createElement("div");
    chevron.className = "chevron";
    chevron.innerHTML = `<svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M5 8L10 13L15 8" stroke="#8a7a63" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    const badgeCol = document.createElement("div");
    badgeCol.style.display = "flex"; badgeCol.style.flexDirection = "column";
    badgeCol.style.alignItems = "flex-end"; badgeCol.style.gap = "8px";
    badgeCol.appendChild(badge); badgeCol.appendChild(chevron);
    top1.appendChild(badgeCol);
    top1.addEventListener("click", ()=> card.classList.toggle("open"));
    list.appendChild(card);
  });

  const otherWrap = document.getElementById("otherWrap");
  const otherList = document.getElementById("otherList");
  otherList.innerHTML = "";
  const others = [...rest.map(r=>r.s), ...ineligible];
  if(others.length === 0){ otherWrap.style.display = "none"; }
  else {
    otherWrap.style.display = "block";
    others.forEach(s=>{
      const c = content[s.id] || s;
      const item = document.createElement("div");
      item.className = "other-item";
      item.innerHTML = `<span class="name">${c.name}</span>`;
      item.addEventListener("click", ()=> alert(c.summary));
      otherList.appendChild(item);
    });
  }
}

/* ============== PORTFOLIO TIPS RENDER ============== */
function renderTips(){
  document.getElementById("tipsEyebrow").textContent = t("tipsEyebrow");
  document.getElementById("tipsTitle").textContent = t("tipsTitle");
  document.getElementById("tipsSub").textContent = t("tipsSub");
  document.getElementById("tipsBackBtn").textContent = t("tipsBack");

  const tabScroll = document.getElementById("tabScroll");
  tabScroll.innerHTML = "";
  TIPS_ORDER.forEach(key=>{
    const cat = PORTFOLIO_TIPS[key];
    const pill = document.createElement("button");
    pill.className = "tab-pill" + (activeTab === key ? " active" : "");
    if(activeTab === key) pill.style.background = cat.color;
    pill.innerHTML = `<span class="dot" style="background:${activeTab===key ? 'rgba(255,255,255,0.7)' : cat.color}"></span>${t("tabs")[key]}`;
    pill.addEventListener("click", ()=>{ activeTab = key; renderTips(); });
    tabScroll.appendChild(pill);
  });

  const cat = PORTFOLIO_TIPS[activeTab];
  const panel = document.getElementById("tipsPanel");
  panel.style.setProperty("--panel-accent", cat.color);
  document.getElementById("tipsPanelTitle").textContent = cat[lang].title;
  const stepsWrap = document.getElementById("tipsSteps");
  stepsWrap.innerHTML = "";
  cat[lang].steps.forEach((step, i)=>{
    const row = document.createElement("div");
    row.className = "tips-step";
    row.innerHTML = `<div class="tips-step-num">${i+1}</div><div class="tips-step-text">${step}</div>`;
    stepsWrap.appendChild(row);
  });
}

/* ============== NAV EVENTS ============== */
document.querySelectorAll(".lang-switch button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    lang = btn.dataset.lang;
    document.querySelectorAll(".lang-switch button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    applyLangToDoc();
    const s = currentScreen();
    if(s==="intro") renderIntro();
    if(s==="question") renderQuestion();
    if(s==="results") renderResults();
    if(s==="tips") renderTips();
  });
});

document.getElementById("startBtn").addEventListener("click", ()=>{
  currentQ = 0; showScreen("question"); renderQuestion();
});

document.getElementById("backBtn").addEventListener("click", ()=>{
  if(currentQ > 0){ currentQ--; renderQuestion(); renderProgress(); }
});

document.getElementById("nextBtn").addEventListener("click", ()=>{
  if(currentQ < 4){ currentQ++; renderQuestion(); renderProgress(); }
  else {
    const account = RahApp.get();
    if(account){ account.finderAnswers = answers; localStorage.setItem("rah-user", JSON.stringify(account)); }
    showScreen("results"); renderResults();
  }
});

document.getElementById("restartBtn").addEventListener("click", ()=>{
  answers = { age: null, country: null, level: null, field: null, english: null };
  currentQ = 0; showScreen("intro"); renderIntro();
});

document.getElementById("tipsLinkIntro").addEventListener("click", ()=>{
  tipsReturnScreen = "intro"; showScreen("tips"); renderTips();
});
document.getElementById("tipsLinkResults").addEventListener("click", ()=>{
  tipsReturnScreen = "results"; showScreen("tips"); renderTips();
});
document.getElementById("tipsBackBtn").addEventListener("click", ()=>{
  showScreen(tipsReturnScreen);
  if(tipsReturnScreen === "intro") renderIntro(); else renderResults();
});

/* ============== INIT ============== */
document.querySelectorAll(".lang-switch button").forEach(b=>{
  b.classList.toggle("active", b.dataset.lang === lang);
});
applyLangToDoc();
renderIntro();
showScreen("intro");
</script>
