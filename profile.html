function render(v){
  const lang = RahI18n.getLang();
  const strings = PROFILE_STRINGS[lang] || PROFILE_STRINGS.en;
  const activity=v.activities.trim()?70:35,e=Number(v.english)*30,a=Number(v.academic)*30;
  scores.innerHTML=[[strings.score_academic,a],[strings.score_english,e],[strings.score_activities,activity],[strings.score_leadership,Math.max(20,activity-5)],[strings.score_materials,45]].map(x=>`<div class="score-row"><div class="score-label"><span>${x[0]}</span><span>${x[1]}%</span></div><div class="score-track"><span style="width:${x[1]}%"></span></div></div>`).join('');

}
